services:
  db:
    image: postgis/postgis:16-3.4
    container_name: trainee_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-change_me}
      POSTGRES_DB: ${DB_NAME:-trainee}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-trainee}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # NOTE: no published ports — Postgres stays private on the internal network.

  app:
    build: .
    container_name: trainee_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Talk to the db container by its service name, not localhost.
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    # NOTE: not published to the host — nginx is the only public entrypoint.
    expose:
      - "8000"

  # Development stack. Same image as `app`, but its own database and secrets
  # (.env.dev → DB_NAME=trainee_dev, DB_USER=dev_app). NODE_ENV is deliberately
  # left to .env.dev: an `environment:` entry here would override it.
  app-dev:
    build: .
    container_name: trainee_api_dev
    restart: unless-stopped
    # required:false so a VPS that has pulled this file but not yet created
    # .env.dev still parses — otherwise every compose command, including
    # `up -d app`, fails on the missing file and takes prod down with it.
    env_file:
      - path: .env.dev
        required: false
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    # Same as `app`: nginx is the only public entrypoint.
    expose:
      - "8000"

  nginx:
    image: nginx:1.27
    container_name: trainee_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
      - /home/robi/jurocwebsite:/var/www/juroc.tech:ro
    depends_on:
      - app
      - juroc-site-api
    # Reload every 6h so renewed certs get picked up without a restart.
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: trainee_certbot
    # Without this the container is never restarted after a reboot or a
    # `docker compose down`, renewals stop silently, and the first sign of
    # trouble is an expired certificate taking the API offline.
    # That happened on 2026-09-10 with api.juroc.tech.
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot:rw
      - certbot_conf:/etc/letsencrypt:rw
    # Attempt renewal every 12h; the bootstrap is done by init-letsencrypt.sh.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  juroc-site-api:
    # Absolute paths on purpose. The compose file lives in ~/Trainee/server/,
    # and the marketing site is a separate project — nesting its checkout
    # inside the Trainee tree just to satisfy a relative path would be worse.
    build: /home/robi/jurocwebsite/server
    container_name: juroc_site_api
    restart: unless-stopped
    env_file: /home/robi/jurocwebsite/server/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      # Must be 0.0.0.0 in a container so nginx can reach it across the network.
      BIND_HOST: 0.0.0.0
    # Not published to the host — nginx is the only public entrypoint,
    # exactly as with trainee_api.
    expose:
      - "3001"
    healthcheck:
      # node:20-slim has no curl or wget; Node 20 has global fetch built in.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  postgres_data:
  certbot_www:
  certbot_conf:
