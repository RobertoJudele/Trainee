# ---- Public trainer pages: salvio.juroc.tech/t/<slug> ----
#
# Temporary home on the existing juroc.tech domain. The path structure is the one
# the real domain will use, so migrating later is a 301 from this host to
# salvio.ro with $request_uri intact — every printed link keeps working.
#
# Proxies to the SAME app container as api.juroc.tech. Only /t/, /p/, the bare
# domain and /antrenori are exposed here: the rest of the API stays on its own
# hostname, so crawlers cannot index JSON endpoints at a second address.

# ---- HTTP: ACME challenge + redirect everything else to HTTPS ----
server {
    listen 80;
    server_name salvio.juroc.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
#
# Enabled only after the certificate exists: nginx refuses to start when
# ssl_certificate points at a missing file, and this container also serves
# api.juroc.tech. Issue the cert first, then reload (not restart) so a bad
# config leaves the running nginx up.

server {
    listen 443 ssl;
    server_name salvio.juroc.tech;

    ssl_certificate     /etc/letsencrypt/live/salvio.juroc.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salvio.juroc.tech/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Same request-time resolution as app.conf: a variable in proxy_pass stops
    # nginx hard-failing with "host not found in upstream" if the app container
    # isn't resolvable the instant nginx boots.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $trainee_app app:8000;

    # The public pages. No client_max_body_size override — these are GET only.
    location /t/ {
        proxy_pass http://$trainee_app$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # Gym poster QR codes. Same treatment as /t/: public GET-only HTML on this
    # host, while the rest of the API stays on api.juroc.tech.
    location /p/ {
        proxy_pass http://$trainee_app$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # The bare domain is the trainer landing page — the "link in bio" of the
    # Salvio videos. The app serves it at /antrenori; the query string (?src=ig)
    # is kept so the visit is attributed to its source.
    location = / {
        proxy_pass http://$trainee_app/antrenori$is_args$args;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # The landing page itself, its counted links (/antrenori/go/...), its
    # screenshots (/antrenori/img/...) and the key-protected /antrenori/stats.
    location /antrenori {
        proxy_pass http://$trainee_app$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # Everything else is API surface that belongs on api.juroc.tech only.
    location / {
        return 404;
    }
}
